<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HỆ THỐNG QUẢN LÝ ĐÀO TẠO LÁI XE - ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans">
    <!-- GIAO DIỆN ADMIN (SỬ DỤNG LẠI CÁC CẤU TRÚC TRƯỚC, TẬP TRUNG VÀO PHẦN LƯƠNG) -->
    <div id="adminDashboard" class="hidden w-full max-w-7xl mx-auto bg-white rounded-3xl shadow-xl p-8">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-black">HỆ THỐNG QUẢN TRỊ DOANH NGHIỆP</h1>
            <div class="flex gap-2">
                <button onclick="openFinanceModal()" class="bg-emerald-50 px-4 py-2 rounded-xl font-bold text-sm">💰 Báo Cáo Tài Chính</button>
                <button onclick="openTeacherTab()" class="bg-indigo-50 px-4 py-2 rounded-xl font-bold text-sm">👨‍🏫 Quản Lý Giáo Viên</button>
                <button onclick="logout()" class="bg-red-50 px-4 py-2 rounded-xl font-bold text-sm">Đăng Xuất</button>
            </div>
        </div>

        <!-- PHÂN QUYỀN HIỂN THỊ (ADMIN STUDENT/TEACHER SECTIONS) -->
        <div id="adminTeacherSection" class="space-y-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-xs uppercase">
                            <th class="p-4">Mã GV</th>
                            <th class="p-4">Thông tin</th>
                            <th class="p-4">Chi tiết Thu nhập (Lý thuyết, Sa hình, HV mới, DAT)</th>
                            <th class="p-4">Khoản trừ khác</th>
                            <th class="p-4">Tổng nhận (PDF)</th>
                        </tr>
                    </thead>
                    <tbody id="adminTeacherTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Data logic mở rộng
        let teachers = JSON.parse(localStorage.getItem('erp_teachers_v14')) || [{ id: 1, name: 'Nguyễn Văn Nam', code: 'GV01', phone: '0901234567', gender: 'Nam', bonusPerStudent: 500000, datKm: 100, sahinhSessions: 5, deductions: 200000 }];
        let students = JSON.parse(localStorage.getItem('erp_students_v14')) || [];

        function calculateTeacherIncome(t) {
            const myStudents = students.filter(s => s.teacherCode === t.code);
            const theory = myStudents.length * 300000;
            const sahinh = (t.sahinhSessions || 0) * 80000;
            const receiveStudent = myStudents.length * 1500000;
            const dat = (t.datKm || 0) * 1500;
            const total = theory + sahinh + receiveStudent + dat - (t.deductions || 0);
            return { count: myStudents.length, theory, sahinh, receiveStudent, dat, total };
        }

        function renderAdminTeacherTable() {
            const tbody = document.getElementById('adminTeacherTableBody');
            tbody.innerHTML = '';
            teachers.forEach(t => {
                const inc = calculateTeacherIncome(t);
                tbody.innerHTML += `
                    <tr class="border-b text-sm">
                        <td class="p-4 font-bold text-indigo-600">${t.code}</td>
                        <td class="p-4">${t.name}<br><span class="text-xs text-slate-500">${t.phone}</span></td>
                        <td class="p-4 text-xs">
                            LT: ${inc.theory.toLocaleString()}đ | SH: ${inc.sahinh.toLocaleString()}đ<br>
                            HV: ${inc.receiveStudent.toLocaleString()}đ | DAT: ${inc.dat.toLocaleString()}đ
                        </td>
                        <td class="p-4"><input type="number" value="${t.deductions || 0}" onchange="updateDeduction(${t.id}, this.value)" class="w-24 border p-1 rounded"></td>
                        <td class="p-4 font-bold text-emerald-600">${inc.total.toLocaleString()}đ<br>
                            <button onclick="printSalaryPDF(${t.id})" class="text-xs bg-blue-600 text-white px-2 py-1 rounded mt-1">🖨️ Xuất Phiếu Lương PDF</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateDeduction(id, val) {
            const t = teachers.find(x => x.id === id);
            t.deductions = Number(val);
            localStorage.setItem('erp_teachers_v14', JSON.stringify(teachers));
            renderAdminTeacherTable();
        }

        function printSalaryPDF(id) {
            const t = teachers.find(x => x.id === id);
            const inc = calculateTeacherIncome(t);
            const win = window.open('', '_blank', 'width=800,height=600');
            win.document.write(`
                <html><head><title>Phiếu Lương - ${t.name}</title>
                <style>body{font-family:Arial;padding:40px;line-height:1.6;} .header{text-align:center;font-weight:bold;margin-bottom:20px;} table{width:100%;border-collapse:collapse;margin:20px 0;} th,td{border:1px solid #ccc;padding:10px;} .total{font-weight:bold;color:blue;}</style>
                </head><body>
                <div class="header"><h2>PHIẾU LƯƠNG GIÁO VIÊN</h2><p>Ngày: ${new Date().toLocaleDateString()}</p></div>
                <p><strong>Họ tên:</strong> ${t.name} | <strong>Mã GV:</strong> ${t.code}</p>
                <table>
                    <tr><th>Nội dung</th><th>Thành tiền</th></tr>
                    <tr><td>Dạy lý thuyết</td><td>${inc.theory.toLocaleString()}đ</td></tr>
                    <tr><td>Tập sa hình</td><td>${inc.sahinh.toLocaleString()}đ</td></tr>
                    <tr><td>Nhận học viên mới</td><td>${inc.receiveStudent.toLocaleString()}đ</td></tr>
                    <tr><td>Chạy DAT (km)</td><td>${inc.dat.toLocaleString()}đ</td></tr>
                    <tr style="color:red"><td>Khấu trừ khác</td><td>-${(t.deductions || 0).toLocaleString()}đ</td></tr>
                    <tr class="total"><td>TỔNG NHẬN</td><td>${inc.total.toLocaleString()}đ</td></tr>
                </table>
                <div class="flex justify-between"><p>Ký tên GV</p><p>Ký tên Kế toán</p></div>
                <script>window.print();window.close();<\/script>
                </body></html>
            `);
        }
        // Gọi render khi cần
        renderAdminTeacherTable();
    </script>
</body>
</html>

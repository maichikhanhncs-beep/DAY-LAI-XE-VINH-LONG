<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Quản Lý Đào Tạo Lái Xe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border">
            <h2 class="text-xl font-black text-center mb-6">ĐĂNG NHẬP HỆ THỐNG</h2>
            <select id="loginRole" class="w-full border p-3 rounded-xl mb-4" onchange="toggleLoginInput()">
                <option value="student">🎓 Học viên</option>
                <option value="teacher">👨‍🏫 Giáo viên</option>
                <option value="admin">🔒 Quản trị viên</option>
            </select>
            <div id="inputGroup" class="space-y-3">
                <input type="text" id="userInput" placeholder="Mã định danh (CCCD/Mã GV/User)" class="w-full border p-3 rounded-xl">
                <input type="password" id="passInput" placeholder="Mật khẩu" class="w-full border p-3 rounded-xl">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-3 rounded-xl mt-4 font-bold">ĐĂNG NHẬP</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD (HIDDEN BY DEFAULT) -->
    <div id="mainApp" class="hidden">
        <!-- Dashboard content will be injected here via JavaScript -->
    </div>

    <script>
        // 1. DATA INITIALIZATION
        let students = JSON.parse(localStorage.getItem('erp_students_v15')) || [];
        let teachers = JSON.parse(localStorage.getItem('erp_teachers_v15')) || [];
        const STEPS = ["Lý thuyết", "Sân thô", "Online", "DAT", "Sa hình", "Tốt nghiệp", "Sát hạch"];

        // 2. CORE FUNCTIONS
        function toggleLoginInput() { /* Logic hiển thị chọn vai trò */ }

        function handleLogin() {
            const role = document.getElementById('loginRole').value;
            const user = document.getElementById('userInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();

            if (role === 'admin') {
                if (user === 'admin' && pass === 'admin123') {
                    localStorage.setItem('role', 'admin');
                    initAdminDashboard();
                } else alert('Sai thông tin Admin');
            } else if (role === 'teacher') {
                const t = teachers.find(x => x.code === user);
                if (t && pass === '123') {
                    localStorage.setItem('role', 'teacher');
                    localStorage.setItem('tCode', t.code);
                    initTeacherDashboard();
                } else alert('Sai thông tin giáo viên');
            } else {
                const s = students.find(x => x.cccd === user);
                if (s && pass === '123') {
                    localStorage.setItem('role', 'student');
                    localStorage.setItem('sCccd', s.cccd);
                    initStudentDashboard();
                } else alert('Sai thông tin học viên');
            }
        }

        function initAdminDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('mainApp').innerHTML = `
                <div class="p-6">
                    <h1 class="text-2xl font-bold mb-4">QUẢN TRỊ TRUNG TÂM</h1>
                    <button onclick="logout()" class="bg-red-500 text-white p-2 rounded">Đăng xuất</button>
                    <div class="mt-6 bg-white p-4 rounded shadow">
                        <h2 class="font-bold mb-2">Danh sách Học viên</h2>
                        <table class="w-full border-collapse border">
                            <thead><tr class="bg-gray-100"><th class="border p-2">Tên</th><th class="border p-2">CCCD</th><th class="border p-2">Thao tác</th></tr></thead>
                            <tbody id="adminStudentBody"></tbody>
                        </table>
                    </div>
                </div>
            `;
            renderAdminStudentTable();
        }

        function renderAdminStudentTable() {
            const tbody = document.getElementById('adminStudentBody');
            if(!tbody) return;
            tbody.innerHTML = students.map(s => `
                <tr>
                    <td class="border p-2">${s.name}</td>
                    <td class="border p-2">${s.cccd}</td>
                    <td class="border p-2"><button onclick="deleteStudent('${s.cccd}')" class="text-red-500">Xóa</button></td>
                </tr>
            `).join('');
        }

        function deleteStudent(cccd) {
            students = students.filter(s => s.cccd !== cccd);
            localStorage.setItem('erp_students_v15', JSON.stringify(students));
            renderAdminStudentTable();
        }

        function logout() { localStorage.clear(); location.reload(); }

        // 3. AUTO LOAD
        window.onload = function() {
            const role = localStorage.getItem('role');
            if (role === 'admin') initAdminDashboard();
            // Add other roles init here...
        };
    </script>
</body>
</html>

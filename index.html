<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Lái Xe Thông Minh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="loginScreen" class="max-w-md w-full bg-white rounded-xl shadow-md p-8 mx-auto mt-20">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">🚗 Hệ Thống Học Lái Xe</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Chọn vai trò đăng nhập:</label>
                <select id="loginRole" class="w-full border p-2.5 rounded-lg" onchange="toggleLoginInput()">
                    <option value="admin">Quản trị viên (Admin)</option>
                    <option value="student">Học viên (Đăng nhập bằng MSSV)</option>
                </select>
            </div>
            <div id="studentLoginGroup" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nhập Mã Số Sinh Viên (MSSV):</label>
                <input type="text" id="loginMSSV" placeholder="Ví dụ: SV001" class="w-full border p-2.5 rounded-lg">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-2.5 rounded-lg hover:bg-blue-700 font-medium">Đăng Nhập</button>
        </div>
    </div>

    <!-- GIAO DIỆN ADMIN -->
    <div id="adminDashboard" class="hidden max-w-7xl mx-auto bg-white rounded-xl shadow-md p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">🚗 Bảng Quản Trị Viên (Admin)</h1>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600">Đăng xuất</button>
        </div>
        
        <!-- Form thêm học viên -->
        <div class="grid grid-cols-1 md:grid-cols-6 gap-3 mb-6 p-4 bg-gray-50 rounded-lg">
            <input type="text" id="addName" placeholder="Họ tên học viên" class="border p-2 rounded">
            <input type="text" id="addMSSV" placeholder="Mã số sinh viên" class="border p-2 rounded">
            <input type="date" id="addStartDate" class="border p-2 rounded" title="Ngày bắt đầu học">
            <select id="addCourse" class="border p-2 rounded">
                <option value="B (Số tự động)">Hạng B (Số tự động - 19.5tr)</option>
                <option value="B (Cơ khí)">Hạng B (Cơ khí - 19.5tr)</option>
                <option value="C1">Hạng C1 (21.5tr)</option>
            </select>
            <div class="flex items-center">
                <input type="checkbox" id="addIsStudent" class="w-5 h-5 mr-2">
                <label for="addIsStudent" class="text-sm font-medium">Giảm 1tr (SV)</label>
            </div>
            <button onclick="addStudent()" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-medium">Thêm học viên</button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-sm">
                        <th class="p-3">Học viên / MSSV</th>
                        <th class="p-3">Hạng</th>
                        <th class="p-3">Tiến độ hiện tại</th>
                        <th class="p-3">Tài chính (Đã đóng / Tổng)</th>
                        <th class="p-3">Quản lý thu học phí (3 đợt)</th>
                        <th class="p-3">Dự báo hoàn thành</th>
                        <th class="p-3">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="divide-y divide-gray-200 text-sm"></tbody>
            </table>
        </div>
    </div>

    <!-- GIAO DIỆN HỌC VIÊN -->
    <div id="studentDashboard" class="hidden max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">📖 Cổng Học Viên - Lộ Trình Của Tôi</h1>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600">Đăng xuất</button>
        </div>
        <div id="studentInfoCard" class="space-y-6">
            <!-- Render lộ trình chi tiết và nút hoàn thành -->
        </div>
    </div>

    <script>
        const STEPS = [
            "1. Học lý thuyết (25 ngày)",
            "2. Học lái xe trong sân thô (2 ngày)",
            "3. Học online hệ thống (25 ngày)",
            "4. Chạy DAT đường trường (4 ngày)",
            "5. Tập sa hình (2 ngày)",
            "6. Thi tốt nghiệp (2 ngày)",
            "7. Thi sát hạch (1 ngày)"
        ];

        let students = JSON.parse(localStorage.getItem('driving_students_v2')) || [
            { id: 1, name: 'Nguyễn Văn A', mssv: 'SV001', course: 'B (Số tự động)', startDate: '2026-03-01', stepIndex: 0, totalPrice: 18500000, isStudent: true, fee1: 'Đã đóng', fee2: 'Chưa đóng', fee3: 'Chưa đóng' }
        ];

        const coursePrices = {
            "B (Số tự động)": 19500000,
            "B (Cơ khí)": 19500000,
            "C1": 21500000
        };

        function toggleLoginInput() {
            const role = document.getElementById('loginRole').value;
            const group = document.getElementById('studentLoginGroup');
            if (role === 'student') group.classList.remove('hidden');
            else group.classList.add('hidden');
        }

        function handleLogin() {
            const role = document.getElementById('loginRole').value;
            if (role === 'admin') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                renderAdminTable();
            } else {
                const mssv = document.getElementById('loginMSSV').value.trim();
                const student = students.find(s => s.mssv.toLowerCase() === mssv.toLowerCase());
                if (!student) {
                    alert('Không tìm thấy Mã số sinh viên này!');
                    return;
                }
                localStorage.setItem('current_mssv', student.mssv);
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('studentDashboard').classList.remove('hidden');
                renderStudentPortal(student);
            }
        }

        function logout() {
            localStorage.removeItem('current_mssv');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('studentDashboard').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginMSSV').value = '';
        }

        function addStudent() {
            const name = document.getElementById('addName').value.trim();
            const mssv = document.getElementById('addMSSV').value.trim();
            const startDate = document.getElementById('addStartDate').value;
            const course = document.getElementById('addCourse').value;
            const isStudent = document.getElementById('addIsStudent').checked;

            if (!name || !mssv || !startDate) return alert('Vui lòng điền đầy đủ Họ tên, MSSV và Ngày bắt đầu!');
            if (students.some(s => s.mssv.toLowerCase() === mssv.toLowerCase())) return alert('MSSV đã tồn tại!');

            let totalPrice = coursePrices[course];
            if (isStudent) totalPrice -= 1000000;

            students.push({
                id: Date.now(), name, mssv, startDate, course, stepIndex: 0, totalPrice, isStudent,
                fee1: 'Chưa đóng', fee2: 'Chưa đóng', fee3: 'Chưa đóng'
            });

            saveAndSync();
            document.getElementById('addName').value = '';
            document.getElementById('addMSSV').value = '';
            document.getElementById('addStartDate').value = '';
            document.getElementById('addIsStudent').checked = false;
        }

        function toggleFee(id, feeType) {
            students = students.map(s => {
                if (s.id === id) {
                    if (feeType === 1) s.fee1 = s.fee1 === 'Chưa đóng' ? 'Đã đóng' : 'Chưa đóng';
                    if (feeType === 2) s.fee2 = s.fee2 === 'Chưa đóng' ? 'Đã đóng' : 'Chưa đóng';
                    if (feeType === 3) s.fee3 = s.fee3 === 'Chưa đóng' ? 'Đã đóng' : 'Chưa đóng';
                }
                return s;
            });
            saveAndSync();
        }

        function deleteStudent(id) {
            if (confirm('Xóa học viên này?')) {
                students = students.filter(s => s.id !== id);
                saveAndSync();
            }
        }

        function saveAndSync() {
            localStorage.setItem('driving_students_v2', JSON.stringify(students));
            if (!document.getElementById('adminDashboard').classList.contains('hidden')) {
                renderAdminTable();
            }
            const currentMssv = localStorage.getItem('current_mssv');
            if (currentMssv) {
                const s = students.find(x => x.mssv === currentMssv);
                if (s) renderStudentPortal(s);
            }
        }

        // Học viên tự bấm hoàn thành bước hiện tại để sang bước tiếp theo
        function studentCompleteStep(id) {
            students = students.map(s => {
                if (s.id === id && s.stepIndex < STEPS.length) {
                    s.stepIndex += 1;
                }
                return s;
            });
            saveAndSync();
            alert('Chúc mừng bạn đã hoàn thành nội dung! Hệ thống đã mở khóa bước tiếp theo.');
        }

        function calculatePaidAmount(s) {
            let paid = 0;
            const f1Val = s.totalPrice * 0.5;
            const f2Val = s.totalPrice * 0.25;
            const f3Val = s.totalPrice * 0.25;
            if (s.fee1 === 'Đã đóng') paid += f1Val;
            if (s.fee2 === 'Đã đóng') paid += f2Val;
            if (s.fee3 === 'Đã đóng') paid += f3Val;
            return paid;
        }

        function getEstimatedCompletionDate(startDateStr) {
            if (!startDateStr) return 'Chưa rõ';
            let d = new Date(startDateStr);
            d.setDate(d.getDate() + 61); // Tổng lộ trình mẫu ~61 ngày
            return d.toLocaleDateString('vi-VN');
        }

        function renderAdminTable() {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';
            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">Chưa có học viên nào.</td></tr>`;
                return;
            }

            students.forEach(s => {
                const paid = calculatePaidAmount(s);
                const estDate = getEstimatedCompletionDate(s.startDate);
                const progressText = s.stepIndex >= STEPS.length ? 'Đã hoàn thành toàn bộ' : STEPS[s.stepIndex];

                const f1Val = (s.totalPrice * 0.5).toLocaleString();
                const f2Val = (s.totalPrice * 0.25).toLocaleString();
                const f3Val = (s.totalPrice * 0.25).toLocaleString();

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 align-top">
                        <td class="p-3">
                            <div class="font-bold text-gray-900">${s.name}</div>
                            <div class="text-xs font-mono text-blue-600">${s.mssv}</div>
                        </td>
                        <td class="p-3">${s.course}</td>
                        <td class="p-3"><span class="px-2 py-1 text-xs bg-yellow-100 text-yellow-800 rounded-full font-medium">${progressText}</span></td>
                        <td class="p-3">
                            <div class="text-green-600 font-bold">${paid.toLocaleString()}đ</div>
                            <div class="text-xs text-gray-500">Tổng: ${s.totalPrice.toLocaleString()}đ</div>
                        </td>
                        <td class="p-3 space-y-1 text-xs">
                            <div>1 (50%): <button onclick="toggleFee(${s.id}, 1)" class="px-1.5 py-0.5 rounded font-semibold ${s.fee1 === 'Đã đóng' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${s.fee1} (${f1Val})</button></div>
                            <div>2 (25%): <button onclick="toggleFee(${s.id}, 2)" class="px-1.5 py-0.5 rounded font-semibold ${s.fee2 === 'Đã đóng' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${s.fee2} (${f2Val})</button></div>
                            <div>3 (25%): <button onclick="toggleFee(${s.id}, 3)" class="px-1.5 py-0.5 rounded font-semibold ${s.fee3 === 'Đã đóng' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${s.fee3} (${f3Val})</button></div>
                        </td>
                        <td class="p-3 font-medium text-purple-600">${estDate}</td>
                        <td class="p-3"><button onclick="deleteStudent(${s.id})" class="text-red-500 hover:text-red-700 font-medium">Xóa</button></td>
                    </tr>
                `;
            });
        }

        function renderStudentPortal(s) {
            const paid = calculatePaidAmount(s);
            const estDate = getEstimatedCompletionDate(s.startDate);

            let stepsHTML = '';
            STEPS.forEach((stepName, idx) => {
                let statusBadge = '';
                let actionBtn = '';

                if (idx < s.stepIndex) {
                    statusBadge = `<span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-full font-semibold">Đã hoàn thành ✅</span>`;
                } else if (idx === s.stepIndex) {
                    statusBadge = `<span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold">Đang học 🎯</span>`;
                    if (s.stepIndex < STEPS.length) {
                        actionBtn = `<button onclick="studentCompleteStep(${s.id})" class="mt-3 bg-green-600 text-white px-4 py-2 rounded-lg text-xs hover:bg-green-700 font-bold">Hoàn thành nội dung này ➔ Mở khóa bước tiếp theo</button>`;
                    }
                } else {
                    statusBadge = `<span class="bg-gray-100 text-gray-500 text-xs px-2.5 py-1 rounded-full">Chưa mở khóa 🔒</span>`;
                }

                stepsHTML += `
                    <div class="p-4 border rounded-xl bg-white shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <h4 class="font-bold text-gray-800 text-sm">${stepName}</h4>
                                ${statusBadge}
                            </div>
                        </div>
                        ${actionBtn}
                    </div>
                `;
            });

            document.getElementById('studentInfoCard').innerHTML = `
                <div class="bg-gray-50 p-4 rounded-xl border space-y-2 text-sm">
                    <div class="flex justify-between"><span>Họ tên: <strong>${s.name}</strong></span> <span>MSSV: <strong class="text-blue-600">${s.mssv}</strong></span></div>
                    <div class="flex justify-between"><span>Hạng: <strong>${s.course}</strong></span> <span>Dự báo hoàn thành: <strong class="text-purple-600">${estDate}</strong></span></div>
                    <div class="flex justify-between"><span>Đã đóng: <strong class="text-green-600">${paid.toLocaleString()}đ</strong> / Tổng: <strong>${s.totalPrice.toLocaleString()}đ</strong></span></div>
                </div>

                <h3 class="font-bold text-gray-800 text-base mt-4">Lộ trình học trực tuyến & Điều kiện mở khóa:</h3>
                <div class="space-y-3">
                    ${stepsHTML}
                </div>
            `;
        }

        // Tự động khôi phục phiên đăng nhập nếu đã đăng nhập trước đó
        window.onload = function() {
            const currentMssv = localStorage.getItem('current_mssv');
            if (currentMssv) {
                const s = students.find(x => x.mssv === currentMssv);
                if (s) {
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('studentDashboard').classList.remove('hidden');
                    renderStudentPortal(s);
                }
            }
        };
    </script>
</body>
</html>
